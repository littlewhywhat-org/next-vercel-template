name: E2E

on:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  e2e:
    if: contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.58.5
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase
        run: supabase start
      - name: Build, start app, e2e
        env:
          NEXT_PUBLIC_ENV: preview
          BASE_URL: http://127.0.0.1:3000
        run: |
          eval "$(supabase status -o env)"
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL:-${SUPABASE_URL:-}}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY:-${SUPABASE_ANON_KEY:-${PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}}}"
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "supabase status did not export API URL / anon or publishable key"
            supabase status -o env | sed -E 's/(KEY|SECRET|PASSWORD|TOKEN)=.*/\1=***/'
            exit 1
          fi
          echo "Using NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
          echo "Using NEXT_PUBLIC_SUPABASE_ANON_KEY prefix=${NEXT_PUBLIC_SUPABASE_ANON_KEY:0:24}"
          cat > .env.production <<EOF
          NEXT_PUBLIC_ENV=preview
          NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
          EOF
          npm run build
          npm start > next-start.log 2>&1 &
          npx wait-on http://127.0.0.1:3000
          npm run test:e2e
      - name: Dump server log
        if: failure()
        run: |
          echo '--- next-start.log ---'
          cat next-start.log || true
      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/
            cucumber-report.json
            next-start.log
          if-no-files-found: ignore
